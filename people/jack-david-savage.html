<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jack David Savage | Profile</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="hero">
    <h1>Profile</h1>
    <p class="subtitle">Biographical record entry.</p>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../register.html">Register</a>
    </nav>
  </header>

  <main class="profile">
    <div class="name">Jack David Savage</div>
    <div class="details">
      <p><strong>Born:</strong> <time class="birth-date" datetime="2004-02-26">26 February 2004</time> <span class="age" aria-live="polite"></span></p>
      <p><strong>Died:</strong> Living</p>
      <p><strong>Father:</strong> Unknown</p>
      <p><strong>Mother:</strong> Unknown</p>
      <p><strong>Spouse:</strong> Unknown</p>
      <p><strong>Children:</strong> None listed</p>
    </div>
    <div class="bio panel">
      <h2>Biography</h2>
      <p>This biography has not yet been written.</p>
    </div>
  </main>

  <script>
    function calculateAge(isoDate) {
      const birthDate = new Date(isoDate);
      if (Number.isNaN(birthDate.getTime())) return null;

      const now = new Date();
      let age = now.getFullYear() - birthDate.getFullYear();
      const monthDiff = now.getMonth() - birthDate.getMonth();

      if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < birthDate.getDate())) {
        age--;
      }
      return age;
    }

    document.querySelectorAll('.birth-date').forEach((birthNode) => {
      const ageNode = birthNode.parentElement.querySelector('.age');
      const isoDate = birthNode.getAttribute('datetime');
      const age = calculateAge(isoDate);

      if (ageNode && age !== null && age >= 0) {
        ageNode.textContent = `(Age ${age})`;
      }
    });
  </script>
</body>
</html>
